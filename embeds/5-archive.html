<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pause to Play · Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap">
<style>
/* The Still Hour, in Pause to Play's own hand: ivory paper, olive ink, sage, compass gold,
   watercolour vignettes and botanical line art. Luxury through space, restraint and craft.
   One committed light look in every theme, like a printed book. */
:root{
  color-scheme:light;
  --ivory:#FBF9F4; --linen:#EFEAE1; --sand:#E4DCCD; --sage:#D9DBC9; --sage-2:#C6CAB0;
  --ink:#38382A; --ink-soft:#5C5B4B; --rule:#DCD4C4;
  --gold:#B8964F; --gold-ink:#7E632E;
  --olive:#34362A; --on-olive:#F4EFE5; --on-olive-soft:#C9C4B2; --gold-on-olive:#D2B57A; --rule-olive:#4A4C3D;
  --display:"EB Garamond", Garamond, "Times New Roman", serif;
  --body:"Jost", "Futura", "Avenir Next", system-ui, sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  --gut:max(20px, env(safe-area-inset-left, 0px));
  --gut-r:max(20px, env(safe-area-inset-right, 0px));
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--body);font-weight:300;font-size:18px;line-height:1.75;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--linen)}
img{max-width:100%;height:auto;display:block}
h1,h2,h3,h4{font-family:var(--display);font-weight:500;line-height:1.08;margin:0;text-wrap:balance;color:var(--ink);letter-spacing:-.01em}
h1{font-size:clamp(3rem,7vw,5.8rem)}
h2{font-size:clamp(2.2rem,4.6vw,3.6rem)}
h3{font-size:clamp(1.6rem,2.4vw,2rem);line-height:1.15}
h1 em,h2 em,h3 em{font-style:italic;font-weight:400;color:var(--gold-ink)}
p{margin:0}
b,strong{font-weight:500}
a{color:inherit;text-decoration-color:var(--gold);text-decoration-thickness:1px;text-underline-offset:5px}
:focus-visible{outline:1px solid var(--gold-ink);outline-offset:4px}
.olive :focus-visible{outline-color:var(--gold-on-olive)}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--ink);color:var(--ivory);padding:10px 16px}
.skip:focus{left:var(--gut)}
.wrap{width:100%;max-width:1220px;margin-inline:auto;padding-left:var(--gut);padding-right:var(--gut-r)}
.narrow{max-width:780px}
.caps{font-family:var(--display);font-weight:500;font-size:.95rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-ink)}
.olive .caps{color:var(--gold-on-olive)}
.soft{color:var(--ink-soft)}
.lede{font-size:clamp(1.12rem,1.6vw,1.28rem);line-height:1.7;color:var(--ink-soft);max-width:54ch}
.olive{background:var(--olive);color:var(--on-olive)}
.olive h1,.olive h2,.olive h3,.olive h4{color:var(--on-olive)}
.olive h1 em,.olive h2 em,.olive h3 em{color:var(--gold-on-olive)}
.olive .lede,.olive .soft{color:var(--on-olive-soft)}
.linen{background:var(--linen)}

/* botanical ornament (her divider, redrawn as line art) */
.orn{display:flex;align-items:center;gap:16px;color:var(--gold)}
.orn::before,.orn::after{content:"";height:1px;width:72px;background:var(--rule)}
.orn svg{width:34px;height:20px}
.orn.c{justify-content:center}
.olive .orn::before,.olive .orn::after{background:var(--rule-olive)}

/* pills, as on her site, refined */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--body);font-weight:400;font-size:.98rem;letter-spacing:.06em;text-decoration:none;text-align:center;line-height:1.3;border:1px solid var(--sage-2);border-radius:999px;padding:15px 34px;background:var(--sage);color:var(--ink);cursor:pointer;transition:background .5s var(--ease),border-color .5s var(--ease),color .5s var(--ease)}
.btn:hover{background:var(--ink);border-color:var(--ink);color:var(--ivory)}
.btn::after{content:"›";font-size:1.2em;line-height:1;transition:transform .5s var(--ease)}
.btn:hover::after{transform:translateX(4px)}
.btn.plain::after{display:none}
.btn.line{background:transparent;border-color:var(--ink)}
.olive .btn{background:var(--gold-on-olive);border-color:var(--gold-on-olive);color:var(--olive)}
.olive .btn:hover{background:transparent;color:var(--gold-on-olive)}
.olive .btn.line{background:transparent;color:var(--on-olive);border-color:var(--on-olive-soft)}
.link{font-family:var(--display);font-weight:500;font-size:.92rem;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;color:var(--gold-ink);display:inline-flex;gap:12px;align-items:center}
.link::after{content:"";width:28px;height:1px;background:currentColor;transition:width .5s var(--ease)}
.link:hover::after{width:52px}
.olive .link{color:var(--gold-on-olive)}

/* ---------- header (her structure, more air) ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(239,234,225,.94);backdrop-filter:saturate(1.2) blur(8px);-webkit-backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:22px;padding-block:14px}
.logo{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:600;font-size:1.42rem;letter-spacing:-.005em;white-space:nowrap}
.logo img{width:44px;height:44px}
.nav{display:flex;gap:2px;margin-left:auto;align-items:center}
.nav a{text-decoration:none;font-size:.95rem;padding:8px 11px;color:var(--ink);white-space:nowrap;border-bottom:1px solid transparent}
.nav a:hover{color:var(--gold-ink)}
.nav a[aria-current="page"]{border-bottom-color:var(--gold)}
.top .btn{padding:11px 22px;font-size:.9rem;background:transparent;border-color:var(--ink)}
.top .btn:hover{background:var(--ink)}
.menu-btn{display:none;margin-left:auto;align-items:center;gap:12px;background:none;border:1px solid var(--ink);border-radius:999px;color:var(--ink);font-family:var(--body);font-size:.88rem;letter-spacing:.08em;cursor:pointer;padding:9px 18px}
@media (max-width:1180px){.nav{display:none}.menu-btn{display:inline-flex}.top .cta{display:none}}
@media (max-width:420px){.logo{font-size:1.2rem}.logo img{width:38px;height:38px}}

/* full-screen menu */
.menu{position:fixed;inset:0;z-index:70;background:var(--linen);overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .6s var(--ease),visibility 0s linear .6s}
.menu.open{opacity:1;visibility:visible;transition:opacity .6s var(--ease)}
.menu .wrap{min-height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:36px;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(32px + env(safe-area-inset-bottom,0px))}
.menu .bar{display:flex;justify-content:space-between;align-items:center}
.menu .close{background:none;border:1px solid var(--ink);border-radius:999px;color:var(--ink);font-family:var(--body);font-size:.88rem;letter-spacing:.08em;cursor:pointer;padding:9px 18px}
.menu .cols{display:grid;grid-template-columns:1.5fr 1fr;gap:56px;align-content:center}
.menu .main{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.menu .main a{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:18px;text-decoration:none}
.menu .main img{width:64px;height:auto}
.menu .main span{font-family:var(--display);font-weight:500;font-size:clamp(2rem,5vw,3.4rem);line-height:1.05;transition:color .4s var(--ease)}
.menu .main small{display:block;font-size:.92rem;color:var(--ink-soft);font-family:var(--body);font-weight:300}
.menu .main a:hover span,.menu .main a[aria-current="page"] span{color:var(--gold-ink)}
.menu .side{display:grid;gap:26px;align-content:start}
.menu .side ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.menu .side a{text-decoration:none;font-size:1.05rem}
.menu .foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:.88rem;color:var(--ink-soft);border-top:1px solid var(--rule);padding-top:18px}
.menu .foot a{text-decoration:none}
@media (max-width:760px){.menu .cols{grid-template-columns:1fr;gap:32px;align-content:start}}

/* ---------- page transitions ---------- */
main{display:block;transition:opacity .45s var(--ease)}
main.leaving{opacity:0}
.view{display:grid;gap:clamp(96px,11vw,156px);padding-bottom:clamp(96px,11vw,150px)}
.view:has(> .olive:last-child){padding-bottom:0}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:1.12fr .88fr;gap:clamp(30px,5vw,80px);align-items:center;padding-top:clamp(48px,7vw,96px)}
.hero>*{min-width:0}
.hero .txt{display:grid;gap:26px}
.hero .motto{font-family:var(--display);font-weight:500;font-size:clamp(1.3rem,2vw,1.6rem);color:var(--ink)}
.hero h1{max-width:11ch}
.hero .row{display:flex;flex-wrap:wrap;align-items:center;gap:18px 30px}
.vignette{position:relative;justify-self:center;width:100%;max-width:500px}
.vignette img{width:100%}
.motion .vignette img{animation:drift 14s ease-in-out infinite}
@keyframes drift{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.025) rotate(-.6deg)}}
.breath{display:flex;align-items:center;gap:16px;font-size:.88rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.breath i{display:block;height:1px;width:120px;background:var(--gold);transform-origin:left;transform:scaleX(.6)}
.motion .breath i{animation:breathe 10s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scaleX(.18)}50%{transform:scaleX(1)}}
@media (max-width:860px){.hero{grid-template-columns:1fr}.vignette{max-width:360px;order:-1}}

/* hold to pause */
.hold{position:relative;display:inline-flex;text-align:left;align-items:center;gap:12px;background:none;border:0;color:var(--ink);font-family:var(--body);font-size:.95rem;letter-spacing:.06em;cursor:pointer;padding:4px 0;-webkit-user-select:none;user-select:none;touch-action:none}
.hold svg{width:46px;height:46px;flex:none}
.hold circle.track{stroke:var(--sage-2)}
.hold circle.prog{stroke:var(--gold-ink);stroke-dasharray:126;stroke-dashoffset:126;transform:rotate(-90deg);transform-origin:center}
.hold small{display:block;font-size:.78rem;color:var(--ink-soft);letter-spacing:.04em}
.still{position:fixed;inset:0;z-index:90;background:rgba(251,249,244,.97);display:grid;place-items:center;text-align:center;padding:var(--gut);opacity:0;visibility:hidden;transition:opacity 1.2s var(--ease),visibility 0s linear 1.2s}
.still.on{opacity:1;visibility:visible;transition:opacity 1.2s var(--ease)}
.still .in{display:grid;gap:28px;justify-items:center;max-width:720px}
.still img{width:min(300px,60vw)}
.still p.q{font-family:var(--display);font-style:italic;font-size:clamp(2rem,5vw,3.2rem);line-height:1.2;color:var(--ink)}

/* ---------- compass (her signature, made interactive) ---------- */
.compass-sec{display:grid;gap:26px;justify-items:center;text-align:center}
.compass-sec .head{display:grid;gap:14px;justify-items:center;max-width:700px}
.rose{position:relative;display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto auto auto;gap:6px 18px;align-items:center;justify-items:center;width:100%;max-width:880px;margin-top:10px}
.dir{display:grid;gap:10px;justify-items:center;text-decoration:none;color:var(--ink);background:none;border:0;padding:6px;cursor:pointer;font:inherit}
.dir img{width:clamp(96px,12vw,150px);transition:transform .7s var(--ease)}
.dir span{font-family:var(--display);font-weight:500;font-size:clamp(1rem,1.6vw,1.35rem);letter-spacing:.24em;text-transform:uppercase;line-height:1.25}
.dir.n{grid-column:2;grid-row:1}
.dir.w{grid-column:1;grid-row:2;grid-template-columns:auto auto;align-items:center;justify-self:end}
.dir.e{grid-column:3;grid-row:2;grid-template-columns:auto auto;align-items:center;justify-self:start}
.dir.w span{order:-1;text-align:right}
.dir.s{grid-column:2;grid-row:3}
.dir.s span{order:2}
.dir.w,.dir.e{display:flex;gap:16px}
.dir.w img,.dir.e img{flex:none}
.dir:hover img,.dir[aria-pressed="true"] img{transform:scale(1.06)}
.dir[aria-pressed="true"] span{color:var(--gold-ink)}
.needle{grid-column:2;grid-row:2;width:clamp(120px,15vw,190px);transition:transform 1.4s cubic-bezier(.34,1.3,.5,1)}
.needle img{width:100%}
.reading{max-width:640px;min-height:150px;display:grid;gap:14px;justify-items:center;padding-top:22px;border-top:1px solid var(--rule)}
.reading p.d{font-family:var(--display);font-size:clamp(1.35rem,2.2vw,1.7rem);line-height:1.35}
@media (max-width:700px){
  .rose{grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;gap:14px}
  .needle{grid-column:1 / -1;grid-row:1}
  .dir.n,.dir.w,.dir.e,.dir.s{grid-column:auto;grid-row:auto;grid-template-columns:1fr;justify-self:center}
  .dir.w,.dir.e{display:grid}
  .dir.w span{order:2;text-align:center}
  .dir img{width:118px}
  .dir span{font-size:.95rem;letter-spacing:.18em}
}

/* ---------- editorial blocks ---------- */
.statement{display:grid;grid-template-columns:repeat(12,1fr);gap:24px}
.statement .k{grid-column:1 / span 3}
.statement .t{grid-column:4 / span 8;display:grid;gap:24px}
.statement .t p.big{font-family:var(--display);font-size:clamp(1.8rem,3.4vw,2.8rem);line-height:1.25}
@media (max-width:860px){.statement .k,.statement .t{grid-column:1 / -1}}
.head{display:grid;gap:16px;max-width:760px}

.index{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.index li{border-bottom:1px solid var(--rule)}
.index a{display:grid;grid-template-columns:4.5rem 1.2fr 1.6fr auto;gap:24px;align-items:center;padding-block:24px;text-decoration:none;transition:background .5s var(--ease),padding .5s var(--ease)}
.index a:hover{padding-inline:16px;background:var(--linen)}
.index .n{font-family:var(--display);font-style:italic;font-size:1.15rem;color:var(--gold-ink)}
.index .n img{width:64px}
.index .h{font-family:var(--display);font-weight:500;font-size:clamp(1.7rem,3vw,2.4rem);line-height:1.08}
.index .d{color:var(--ink-soft);font-size:1rem}
.index .m{font-family:var(--display);font-size:.9rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-ink);white-space:nowrap}
@media (max-width:860px){.index a{grid-template-columns:3.6rem 1fr;gap:4px 14px}.index .d,.index .m{grid-column:2}.index .n img{width:52px}}

/* method as a day */
.day{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:28px;padding-top:86px}
.day svg.arc{position:absolute;left:0;top:0;width:100%;height:80px;overflow:visible}
.day svg.arc path{fill:none;stroke:var(--gold);stroke-width:1;stroke-dasharray:var(--len);stroke-dashoffset:0;transition:stroke-dashoffset 2.6s var(--ease)}
.day svg.arc circle{fill:var(--linen);stroke:var(--gold);vector-effect:non-scaling-stroke}
.day .st{display:grid;gap:10px;align-content:start;transition:opacity 1s var(--ease)}
.day .st .time{font-family:var(--display);font-size:.9rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-ink)}
.day .st h3{font-size:clamp(1.6rem,2.3vw,2rem)}
.day .st p{color:var(--ink-soft);font-size:1rem}
.motion .day:not(.seen) .st{opacity:.6}
.motion .day:not(.seen) svg.arc path{stroke-dashoffset:var(--len)}
@media (max-width:860px){.day{grid-template-columns:1fr 1fr;padding-top:0}.day svg.arc{display:none}.day .st{border-top:1px solid var(--rule);padding-top:16px}}
@media (max-width:520px){.day{grid-template-columns:1fr}}
.band{padding-block:clamp(80px,10vw,140px)}

.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(36px,7vw,110px);align-items:center}
.split>*{min-width:0}
.split .txt{display:grid;gap:22px;align-content:center}
.split.rev .fig{order:2}
@media (max-width:860px){.split{grid-template-columns:1fr}.split.rev .fig{order:0}}
.facts{display:flex;flex-wrap:wrap;gap:12px 40px;padding-block:16px;border-block:1px solid var(--rule)}
.facts div{display:grid;gap:0}
.facts b{font-family:var(--display);font-weight:500;font-size:2rem;line-height:1.1}
.facts span{font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}

/* book display: her covers on a sand table */
.shelf{background:var(--sand);display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:clamp(18px,3vw,40px);padding:clamp(30px,5vw,60px) clamp(18px,4vw,56px)}
.shelf figure{margin:0;display:grid;gap:12px;justify-items:center;text-align:center}
.shelf img{width:clamp(130px,15vw,190px);box-shadow:0 18px 30px -18px rgba(40,36,24,.55);transition:transform .7s var(--ease)}
.shelf figure:hover img{transform:translateY(-6px) rotate(-.6deg)}
.shelf figcaption{font-size:.85rem;color:var(--ink-soft)}
.shelf .free{font-family:var(--display);font-style:italic;color:var(--ink)}
.book{width:100%;max-width:300px;box-shadow:0 26px 40px -24px rgba(40,36,24,.6)}

.spread{display:grid;grid-template-columns:1fr 1px 1fr;gap:clamp(30px,5vw,72px)}
.spread .sep{background:var(--rule)}
.spread>div{display:grid;gap:16px;align-content:start;min-width:0}
.spread q{quotes:none;font-family:var(--display);font-size:clamp(1.6rem,2.6vw,2.1rem);line-height:1.32}
.spread .src{font-size:.85rem;color:var(--ink-soft)}
@media (max-width:860px){.spread{grid-template-columns:1fr}.spread .sep{height:1px}}

.carte{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.carte li{display:grid;grid-template-columns:1fr auto;gap:8px 30px;padding-block:26px;border-bottom:1px solid var(--rule)}
.carte h3{font-size:clamp(1.6rem,2.4vw,2.1rem)}
.carte .price{font-family:var(--display);font-size:1.7rem;white-space:nowrap;align-self:baseline}
.carte .price small{font-family:var(--body);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-right:6px}
.carte p{grid-column:1;color:var(--ink-soft);max-width:58ch}
.carte .meta{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center}
.carte .meta span{font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink)}
.olive .carte,.olive .carte li{border-color:var(--rule-olive)}
.olive .carte p,.olive .carte .price small{color:var(--on-olive-soft)}
.olive .carte .meta span{color:var(--gold-on-olive)}
@media (max-width:600px){.carte li{grid-template-columns:1fr}}

.author{display:grid;grid-template-columns:minmax(160px,300px) 1fr;gap:clamp(30px,6vw,90px);align-items:center}
.portrait{aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--linen);border:1px solid var(--gold);box-shadow:0 0 0 10px var(--ivory),0 0 0 11px var(--rule);display:grid;place-items:center;text-align:center;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);padding:20px}
.author blockquote{margin:0;font-family:var(--display);font-style:italic;font-size:clamp(1.8rem,3vw,2.6rem);line-height:1.25}
@media (max-width:700px){.author{grid-template-columns:1fr}.portrait{max-width:220px}}

.signup{display:grid;grid-template-columns:auto 1.1fr 1fr;gap:clamp(30px,5vw,70px);align-items:center}
.signup img{width:clamp(130px,14vw,180px);box-shadow:0 22px 40px -20px rgba(0,0,0,.6)}
@media (max-width:960px){.signup{grid-template-columns:1fr}.signup img{justify-self:start}}
form.line{display:grid;grid-template-columns:1fr auto;gap:0;border-bottom:1px solid var(--on-olive-soft)}
form.line input{font:inherit;font-size:1.1rem;background:transparent;border:0;color:var(--on-olive);padding:16px 2px;min-width:0}
form.line input::placeholder{color:var(--on-olive-soft)}
form.line button{background:none;border:0;color:var(--gold-on-olive);font-family:var(--display);font-size:.95rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;padding:0 4px 0 18px}
.fine{font-size:.88rem;color:var(--on-olive-soft);margin-top:14px}
.thanks{font-family:var(--display);font-style:italic;font-size:1.6rem;color:var(--gold-on-olive)}

.form{display:grid;gap:28px;max-width:720px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media (max-width:640px){.form .two{grid-template-columns:1fr}}
.field{display:grid;gap:6px}
.field label{font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.field input,.field select,.field textarea{font:inherit;font-size:1.08rem;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink-soft);border-radius:0;padding:10px 2px;min-width:0;width:100%}
.field textarea{resize:vertical;min-height:120px}
.field select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 14px) 55%,calc(100% - 9px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-bottom-color:var(--gold-ink);box-shadow:0 1px 0 var(--gold-ink)}

.filters{display:flex;flex-wrap:wrap;gap:6px 28px;border-bottom:1px solid var(--rule)}
.filters button{background:none;border:0;border-bottom:1px solid transparent;margin-bottom:-1px;padding:14px 0;font-family:var(--display);font-size:.95rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);cursor:pointer}
.filters button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.rows{list-style:none;margin:0;padding:0}
.rows li{border-bottom:1px solid var(--rule)}
.rows a{display:grid;grid-template-columns:9rem 1fr auto;gap:20px;align-items:baseline;padding-block:20px;text-decoration:none}
.rows .c{font-family:var(--display);font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-ink)}
.rows .t{font-family:var(--display);font-size:clamp(1.3rem,2vw,1.55rem);line-height:1.25}
.rows .x{font-size:.82rem;color:var(--ink-soft);white-space:nowrap}
.rows a:hover .t{text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:1px;text-underline-offset:6px}
@media (max-width:700px){.rows a{grid-template-columns:1fr;gap:2px}.rows .x{display:none}}
.olive .rows li{border-color:var(--rule-olive)}
.olive .rows .c{color:var(--gold-on-olive)}

.found{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:0;border-top:1px solid var(--rule)}
.found section{padding:32px 32px 32px 0;border-bottom:1px solid var(--rule);display:grid;gap:12px;align-content:start}
.found h3 em{font-size:.6em;display:block;margin-bottom:4px}
.found .note{font-family:var(--display);font-size:1.3rem;line-height:1.38}
.found ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}

.quiz{display:grid;gap:36px;max-width:900px}
.qbar{height:1px;background:var(--rule);position:relative}
.qbar span{position:absolute;left:0;top:0;bottom:0;background:var(--gold);transition:width .8s var(--ease)}
.opts{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.opts button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);color:var(--ink);font-family:var(--display);font-size:clamp(1.4rem,2.4vw,1.9rem);line-height:1.25;padding:20px 4px;cursor:pointer;display:grid;grid-template-columns:2.4rem 1fr;gap:12px;transition:color .4s var(--ease),padding .5s var(--ease)}
.opts button b{font-style:italic;font-weight:400;font-size:1.05rem;color:var(--gold-ink);padding-top:.45em}
.opts button:hover{color:var(--gold-ink);padding-left:16px}
.result{display:grid;gap:24px}

.subhero{display:grid;grid-template-columns:1.2fr .8fr;gap:clamp(30px,5vw,80px);align-items:center;padding-top:clamp(48px,7vw,96px)}
.subhero>*{min-width:0}
.subhero .txt{display:grid;gap:22px}
.subhero img.v{width:clamp(200px,24vw,300px);justify-self:center}
@media (max-width:860px){.subhero{grid-template-columns:1fr}.subhero img.v{order:-1;width:200px}}

details{border-bottom:1px solid var(--rule)}
summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:1fr auto;gap:20px;padding-block:22px;font-family:var(--display);font-weight:500;font-size:clamp(1.3rem,2.2vw,1.6rem);line-height:1.25}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--body);font-weight:300;font-size:1.4rem;color:var(--gold-ink);transition:transform .4s var(--ease)}
details[open] summary::after{transform:rotate(45deg)}
details p{padding-bottom:22px;color:var(--ink-soft);max-width:64ch}

.foot{background:var(--linen);border-top:1px solid var(--rule)}
.foot .wrap{padding-block:clamp(60px,8vw,100px) 36px;display:grid;gap:50px}
.foot .grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:40px}
.foot h2{font-size:clamp(2rem,3.6vw,2.8rem)}
.foot ul{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.foot a{text-decoration:none}
.foot a:hover{color:var(--gold-ink)}
.foot .base{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-top:22px;border-top:1px solid var(--rule);font-size:.85rem;color:var(--ink-soft)}
@media (max-width:860px){.foot .grid{grid-template-columns:1fr 1fr}.foot .grid>div:first-child{grid-column:1 / -1}}


/* ---------- the day (home is one slow day, dawn to night) ---------- */
.hour{display:flex;align-items:baseline;gap:14px;margin:0;font-family:var(--display);color:var(--gold-ink)}
.hour b{font-weight:400;font-style:italic;font-size:1.5rem;letter-spacing:.02em}
.hour span{font-weight:500;font-size:.86rem;letter-spacing:.28em;text-transform:uppercase}
.hour::after{content:"";flex:0 0 40px;height:1px;background:currentColor;opacity:.5;align-self:center}
.compass-sec .hour{justify-content:center}
.olive .hour{color:var(--gold-on-olive)}
.dawn{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,5vw,80px);align-items:center;padding-top:clamp(40px,6vw,80px);min-height:min(88vh,900px)}
.dawn>*{min-width:0}
.dawn .txt{display:grid;gap:26px}
.dawn .motto{font-family:var(--display);font-weight:500;font-size:clamp(1.3rem,2vw,1.6rem)}
.dawn h1{font-size:clamp(3.2rem,7.4vw,6.6rem);line-height:.98;max-width:9ch}
.dawn .row{display:flex;flex-wrap:wrap;align-items:center;gap:18px 30px}
.dial{position:relative;width:100%;max-width:600px;aspect-ratio:1;justify-self:center;display:grid;place-items:center}
.dial .ring{position:absolute;inset:0;width:100%;height:100%;color:var(--gold);transform:rotate(var(--rot,0deg));transition:transform .2s linear}
.dial img{width:76%;position:relative}
.motion .dial img{animation:drift 14s ease-in-out infinite}
.scrollcue{display:flex;align-items:center;gap:16px;font-family:var(--display);font-size:.9rem;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft);margin-top:calc(-1 * clamp(60px,8vw,110px))}
.scrollcue i{display:block;width:1px;height:46px;background:linear-gradient(var(--gold),transparent)}
.motion .scrollcue i{animation:cue 2.8s var(--ease) infinite;transform-origin:top}
@keyframes cue{0%{transform:scaleY(0)}60%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
@media (max-width:860px){.dawn{grid-template-columns:1fr;min-height:0}.dial{max-width:380px;order:-1}.scrollcue{display:none}}
.plinth{position:relative;padding:48px 64px;background:radial-gradient(closest-side,var(--linen),transparent)}
.golden{background:linear-gradient(180deg,var(--ivory),#F1E7D3 30%,#EEDFC4)}
.golden .shelf{background:rgba(255,255,255,.35);border:1px solid rgba(184,150,79,.35)}
.golden .shelf figcaption{color:var(--ink)}
.dusk{height:clamp(160px,18vw,260px);margin-bottom:calc(-1 * clamp(96px,11vw,156px));background:linear-gradient(180deg,var(--ivory),#D9C6A3 35%,#7B6E55 70%,var(--olive))}
.view>.dusk+.olive{margin-top:0}
.evening{padding-top:clamp(40px,5vw,70px)}
.night-end{background:#2A2C22;margin-top:calc(-1 * clamp(96px,11vw,156px))}
.night{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule-olive)}
.night li{border-bottom:1px solid var(--rule-olive)}
.night a{display:grid;grid-template-columns:3.5rem 1fr auto;gap:20px;align-items:baseline;padding-block:22px;text-decoration:none;transition:padding .5s var(--ease)}
.night .n{font-family:var(--display);font-style:italic;color:var(--gold-on-olive)}
.night .t{font-family:var(--display);font-size:clamp(1.5rem,3vw,2.5rem);line-height:1.12;transition:color .4s var(--ease)}
.night .c{font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--on-olive-soft);white-space:nowrap}
.night a:hover{padding-left:18px}
.night a:hover .t{color:var(--gold-on-olive)}
@media (max-width:700px){.night a{grid-template-columns:2.4rem 1fr}.night .c{grid-column:2}}
.peek{position:fixed;left:0;top:0;width:230px;z-index:45;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.85);transition:opacity .45s var(--ease),transform .6s var(--ease)}
.peek.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media (hover:none){.peek{display:none}}
.sunclock{position:fixed;left:max(22px,env(safe-area-inset-left));top:50%;transform:translateY(-50%);z-index:40;display:none;gap:14px;justify-items:center;pointer-events:none;color:var(--gold)}
body.home-on .sunclock{display:grid}
.sunclock .rail{position:relative;width:1px;height:200px;background:currentColor;opacity:.45}
.sunclock .sun{position:absolute;left:50%;top:calc(var(--day,0) * 100%);width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 5px rgba(184,150,79,.2);transition:top .3s linear}
.sunclock .tm{font-family:var(--display);font-style:italic;font-size:1.05rem}
@media (max-width:1360px){body.home-on .sunclock{display:none}}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition-duration:.01ms!important;animation:none!important}
}

/* ================= The Daily Pause: one simple thing a day ================= */
.today{display:grid;grid-template-columns:.95fr 1.05fr;gap:clamp(30px,6vw,96px);align-items:center;padding-top:clamp(36px,5vw,72px)}
.today>*{min-width:0}
.today .dial{max-width:560px}
.today .txt{display:grid;gap:24px}
.almanac{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;font-family:var(--display);color:var(--gold-ink)}
.almanac .no{font-style:italic;font-size:clamp(2.6rem,4.6vw,3.8rem);line-height:1;color:var(--ink)}
.almanac .no small{font-size:.42em;font-style:normal;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-ink);margin-right:8px;vertical-align:.5em}
.almanac .meta{font-weight:500;font-size:.88rem;letter-spacing:.24em;text-transform:uppercase}
.today h1{font-size:clamp(2.6rem,5.4vw,4.6rem);line-height:1.02;max-width:14ch}
.today .why{font-size:clamp(1.08rem,1.4vw,1.2rem);color:var(--ink-soft);max-width:52ch}
.today .src{font-size:.86rem;color:var(--ink-soft)}
.today .src b{font-weight:500;color:var(--ink)}
.today .row{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center}
.ghost{background:none;border:0;padding:0;cursor:pointer;font-family:var(--display);font-weight:500;font-size:.92rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-ink);display:inline-flex;gap:12px;align-items:center}
.ghost::after{content:"";width:28px;height:1px;background:currentColor;transition:width .5s var(--ease)}
.ghost:hover::after{width:52px}
.olive .ghost{color:var(--gold-on-olive)}
.streak{font-size:.88rem;color:var(--ink-soft)}
.streak b{font-family:var(--display);font-style:italic;font-weight:400;font-size:1.2rem;color:var(--gold-ink)}
@media (max-width:900px){.today{grid-template-columns:1fr}.today .dial{max-width:340px;order:-1}}

/* tomorrow line under hero */
.tomorrow{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;padding:24px 0;border-block:1px solid var(--rule)}
.tomorrow p{font-family:var(--display);font-size:clamp(1.2rem,2vw,1.5rem);line-height:1.3}
.tomorrow .when{font-family:var(--display);font-style:italic;font-size:2rem;color:var(--gold-ink);line-height:1}
.tomorrow form.line{border-bottom-color:var(--ink-soft);min-width:min(420px,100%)}
.tomorrow form.line input{color:var(--ink)}
.tomorrow form.line input::placeholder{color:var(--ink-soft)}
.tomorrow form.line button{color:var(--gold-ink)}
.tomorrow .thanks{color:var(--gold-ink);font-size:1.3rem}
@media (max-width:900px){.tomorrow{grid-template-columns:1fr}}

/* the week as almanac pages */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:0;border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.week>*{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:18px 16px 22px;display:grid;gap:10px;align-content:start;text-decoration:none;min-height:230px;min-width:0;transition:background .5s var(--ease)}
.week a:hover{background:var(--linen)}
.week .d{font-family:var(--display);font-size:.82rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
.week .n{font-family:var(--display);font-style:italic;font-size:1.7rem;line-height:1;color:var(--gold-ink)}
.week .t{font-family:var(--display);font-size:1.15rem;line-height:1.25;overflow-wrap:break-word}
.week .f{font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-top:auto}
.week .is-today{background:var(--olive);color:var(--on-olive)}
.week .is-today:hover{background:var(--olive)}
.week .is-today .n{color:var(--gold-on-olive)}
.week .is-today .d,.week .is-today .f{color:var(--on-olive-soft)}
.week .locked{color:var(--ink-soft);background:repeating-linear-gradient(135deg,transparent 0 9px,rgba(184,150,79,.08) 9px 10px)}
.week .locked .t{font-style:italic;color:var(--ink-soft)}
@media (max-width:1000px){.week{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}.week>*{scroll-snap-align:start;min-height:210px}}

/* how it works */
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(24px,4vw,56px)}
.how div{display:grid;gap:10px;align-content:start;padding-top:18px;border-top:1px solid var(--gold)}
.how b{font-family:var(--display);font-style:italic;font-weight:400;font-size:2.4rem;line-height:1;color:var(--gold-ink)}
.how h3{font-size:clamp(1.5rem,2.2vw,1.9rem)}
.how p{color:var(--ink-soft);font-size:1rem}
@media (max-width:800px){.how{grid-template-columns:1fr}}

/* foundations wheel as index */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));column-gap:56px;border-top:1px solid var(--rule)}
.fgrid a{display:grid;grid-template-columns:3rem 1fr auto;gap:14px;align-items:baseline;padding:22px 18px 22px 0;border-bottom:1px solid var(--rule);text-decoration:none;transition:padding .5s var(--ease),background .5s var(--ease)}
.fgrid a:hover{padding-left:14px;background:var(--linen)}
.fgrid .r{font-family:var(--display);font-style:italic;color:var(--gold-ink)}
.fgrid .h{font-family:var(--display);font-size:1.7rem;line-height:1.1}
.fgrid .c{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}

/* membership */
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--rule)}
.tier{display:grid;gap:18px;align-content:start;padding:clamp(26px,3vw,40px);border-right:1px solid var(--rule);min-width:0}
.tier:last-child{border-right:0}
.tier .price{font-family:var(--display);font-size:clamp(2.4rem,4vw,3.2rem);line-height:1}
.tier .price small{font-family:var(--body);font-size:.85rem;color:var(--ink-soft);letter-spacing:.04em;margin-left:6px}
.tier ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tier li{padding-left:22px;position:relative;font-size:1rem}
.tier li::before{content:"";position:absolute;left:0;top:.75em;width:10px;height:1px;background:var(--gold)}
.tier .alt{font-size:.88rem;color:var(--ink-soft)}
.tier.star{background:var(--olive);color:var(--on-olive);border-color:var(--olive)}
.tier.star h3{color:var(--on-olive)}
.tier.star .caps{color:var(--gold-on-olive)}
.tier.star .price small,.tier.star .alt{color:var(--on-olive-soft)}
.tier.star .btn{background:var(--gold-on-olive);border-color:var(--gold-on-olive);color:var(--olive)}
.tier.star .btn:hover{background:transparent;color:var(--gold-on-olive)}
@media (max-width:900px){.tiers{grid-template-columns:1fr}.tier{border-right:0;border-bottom:1px solid var(--rule)}.tier:last-child{border-bottom:0}}

/* Slack mock for teams */
.slack{background:#FFFFFF;color:#1D1C1D;border-radius:10px;box-shadow:0 30px 60px -30px rgba(0,0,0,.6);padding:18px 20px;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45;max-width:520px;width:100%}
.slack .who{display:flex;gap:10px;align-items:center}
.slack .who img{width:36px;height:36px;border-radius:6px;background:var(--linen);padding:3px}
.slack .who b{font-weight:700}
.slack .who span{font-size:12px;color:#616061}
.slack .who i{font-style:normal;font-size:10px;font-weight:700;background:#E8E8E8;color:#454245;border-radius:3px;padding:1px 4px}
.slack .body{margin:8px 0 0 46px;display:grid;gap:8px}
.slack .body .tt{font-weight:700}
.slack .acts{display:flex;flex-wrap:wrap;gap:8px}
.slack .acts span{border:1px solid #BBBABB;border-radius:4px;padding:4px 12px;font-size:14px;font-weight:700}
.slack .acts span.pri{background:#4A5A35;border-color:#4A5A35;color:#fff}
.slack .react{font-size:12px;color:#616061}

/* pause pages */
.pp{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,6vw,90px);align-items:start;padding-top:clamp(36px,5vw,72px)}
.pp>*{min-width:0}
.pp .txt{display:grid;gap:22px}
.pp h2{font-size:clamp(1.5rem,2.4vw,2rem)}
@media (max-width:900px){.pp{grid-template-columns:1fr}}
.steps{margin:0;padding-left:1.4em;display:grid;gap:8px;color:var(--ink-soft)}
.steps::marker{color:var(--gold-ink)}

/* full-screen guided pause */
.timer{position:relative;width:min(300px,62vw);aspect-ratio:1;display:grid;place-items:center}
.timer svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.timer .tr{stroke:var(--rule)}
.timer .pg{stroke:var(--gold-ink);stroke-dasharray:942.5;stroke-dashoffset:942.5;transition:stroke-dashoffset 1s linear}
.timer img{width:72%;border-radius:50%}
.timer .sec{position:absolute;bottom:-46px;left:0;right:0;font-family:var(--display);font-style:italic;font-size:1.6rem;color:var(--gold-ink)}
.still .in{gap:22px}
.still .inst{font-family:var(--display);font-size:clamp(1.5rem,3.6vw,2.4rem);line-height:1.25;color:var(--ink);max-width:24ch;margin-top:40px}
.still .done-row{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 26px;align-items:center}
.still .eyebrow{font-family:var(--display);font-weight:500;font-size:.9rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--ivory);padding:12px 22px;border-radius:999px;font-size:.92rem;opacity:0;transition:opacity .4s var(--ease),transform .4s var(--ease);z-index:95;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

.still{background:var(--ivory)}

/* B (2026-10-26): no compass, the watercolour alone and larger */
.dial img{width:100%;filter:drop-shadow(0 26px 30px rgba(80,70,40,.12))}
.view{grid-template-columns:minmax(0,1fr)}

/* actions under a pause (2026-10-27): two equal buttons, then one quiet line */
.acts{display:flex;flex-wrap:wrap;gap:12px}
.acts .btn{min-width:0}
.btn.line{background:transparent;border-color:var(--ink);color:var(--ink)}
.btn.line:hover{background:var(--ink);color:var(--ivory)}
.more{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;padding-top:16px;border-top:1px solid var(--rule);font-size:.95rem}
.more a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:5px}
.more a:hover{color:var(--gold-ink)}
.more .streak{margin:0}
.btn.line::after{content:none}
/* Begin is the one thing to do: solid olive, larger (2026-10-27) */
.txt>.acts .js-begin{background:var(--olive);border-color:var(--olive);color:var(--on-olive);font-weight:400;font-size:1.05rem;padding:18px 40px;box-shadow:0 14px 26px -16px rgba(52,54,42,.7)}
.txt>.acts .js-begin:hover{background:#23251B;border-color:#23251B;color:var(--on-olive)}
.txt>.acts .js-card{padding:18px 32px;font-size:1.05rem}

var PZ=[
 ["sleep", "Thirty minutes before bed, dim the lights and swap the screen for a paper book.", "After reading on a tablet before bed, people took about ten minutes longer to fall asleep, had less dream sleep and felt sleepier the next morning than after reading a printed book.", "Chang et al. (Harvard Medical School), PNAS, 2015", 60, ["Dim the lights in the room.", "Leave your phone to charge outside the bedroom.", "Open a paper book."]],
 ["movement", "Take a walk with one open question. Don’t chase the answer.", "At Stanford, people came up with about 60% more creative ideas while walking than while sitting, even on a treadmill in a plain room.", "Oppezzo & Schwartz, Journal of Experimental Psychology, 2014", 60, ["Choose one question you carry.", "Step outside and start walking.", "Let the question walk with you. Don’t chase the answer."]],
 ["nature", "Go outside for twenty minutes. No music. No podcast. No goal.", "Twenty to thirty minutes in a place that felt like nature lowered the stress hormone cortisol most efficiently.", "Hunter et al., Frontiers in Psychology, 2019", 60, ["Choose your twenty minutes now.", "Pick a place with trees or water.", "No phone, no podcast, no step count."]],
 ["stillness", "Stay in silence two minutes longer than feels comfortable.", "In one study, 67% of men and 25% of women chose to give themselves a mild electric shock rather than sit alone with their thoughts for fifteen minutes. Silence takes practice.", "Wilson et al., Science, 2014", 120, ["Put everything down.", "Sit in the quiet you have.", "When you want to stop, stay two minutes more."]],
 ["connection", "When you buy your coffee, smile, make eye contact and have a short chat.", "Customers asked to smile and chat briefly with the barista left in a better mood and felt more connected than customers who were simply efficient.", "Sandstrom & Dunn, Social Psychological and Personality Science, 2014", 60, ["When you order, look up.", "Smile and make eye contact.", "Ask one small question, and listen."]],
 ["nourishment", "Add one new plant to a meal today. Aim for thirty a week.", "People who ate more than 30 different plants a week had more diverse gut bacteria than people who ate 10 or fewer, whatever their diet.", "McDonald et al., mSystems, 2018", 60, ["Look at your next meal.", "Add one plant you haven’t eaten this week: herbs, seeds, a fruit.", "Count it."]],
 ["joy", "Write down three good things from today.", "People who wrote down three things that went well each day, and why, were still a little happier months later, especially those who kept doing it.", "Seligman et al., American Psychologist, 2005", 90, ["Take a pen, or your notes app.", "Write three small good things.", "For each, write why it happened."]],
 ["sleep", "Before bed, write tomorrow’s to-do list. Then say: “Noted. We’ll handle this tomorrow.”", "People who spent five minutes writing a to-do list fell asleep about nine minutes faster than people who wrote about what they had already done.", "Scullin et al., Journal of Experimental Psychology: General, 2018", 120, ["Take a pen and paper.", "Write down everything tomorrow needs.", "Say: “Noted. We’ll handle this tomorrow.”"]],
 ["movement", "Walk for ten minutes after your next meal.", "A review of seven studies found that even two to five minutes of light walking after eating kept blood sugar steadier than sitting or standing.", "Buffey et al., Sports Medicine, 2022", 60, ["Stand up now.", "Walk slowly for one minute.", "Promise yourself ten after lunch."]],
 ["nature", "Count your minutes in nature this week. Aim for 120.", "In a study of nearly 20,000 people, those who spent at least 120 minutes a week in nature were more likely to report good health and wellbeing. One long visit or several short ones worked equally well.", "White et al., Scientific Reports, 2019", 30, ["Think back over this week.", "Add up your minutes among trees, water or green.", "Plan the rest of your 120."]],
 ["stillness", "Two breaths in through the nose, one long breath out. Repeat for five minutes.", "In a Stanford study, five minutes a day of this breathing for a month lifted mood more than the same time spent in mindfulness meditation.", "Balban et al., Cell Reports Medicine, 2023", 300, ["Breathe in through the nose.", "Take a second, shorter breath on top.", "Let it all go, slowly, through the mouth."]],
 ["connection", "With your morning coffee, text one person: “This made me think of you.”", "In studies with more than 5,900 people, those who reached out underestimated how much it was appreciated, most of all when the message came as a surprise.", "Liu et al., Journal of Personality and Social Psychology, 2022", 60, ["Think of someone who crossed your mind lately.", "Write: “This made me think of you.”", "Send it. No need to say more."]],
 ["nourishment", "Drink a full glass of water before your next coffee.", "Losing just 1.5% of the body’s water, often before you feel really thirsty, left young women with lower mood, more fatigue and more trouble concentrating.", "Armstrong et al., Journal of Nutrition, 2012", 30, ["Fill a glass.", "Drink it slowly, standing still.", "Notice the cold."]],
 ["joy", "Look for one beautiful thing on your way today.", "Older adults who took a weekly fifteen-minute “awe walk” for eight weeks felt more gratitude and less distress, and their smiles in selfies grew broader.", "Sturm et al., Emotion, 2022", 60, ["On your next walk, slow down.", "Look up, and look closely.", "Stop for the one thing that moves you."]],
 ["sleep", "Take a warm shower about ninety minutes before bed.", "A review of 13 studies found that a warm bath or shower one to two hours before bed helped people fall asleep about ten minutes faster. It helps the body cool down afterwards, which is the signal for sleep.", "Haghayegh et al., Sleep Medicine Reviews, 2019", 30, ["Decide when you want to be asleep.", "Count back ninety minutes.", "Set a gentle reminder for your shower."]],
 ["movement", "Walk at a pace where you could still talk.", "In a survey of 1.2 million Americans, people who moved regularly, walking included, reported fewer days when they felt stressed or low than people who did not move at all.", "Chekroud et al., The Lancet Psychiatry, 2018", 60, ["Start walking.", "Speed up until talking takes a little effort.", "Stay there. That is your pace."]],
 ["nature", "Look at something green for forty seconds.", "Students who looked at a flowering green roof for just forty seconds made fewer mistakes on a dull task afterwards than students who looked at a concrete roof.", "Lee et al., Journal of Environmental Psychology, 2015", 40, ["Find a plant, a tree or a park.", "Look at it, only it.", "Notice how many greens there are."]],
 ["stillness", "Put your phone in another room for the next hour.", "People whose phone simply lay on the desk, face down and even switched off, did worse on memory and reasoning tests than people who left it in another room.", "Ward et al., Journal of the Association for Consumer Research, 2017", 30, ["Silence your phone.", "Carry it to another room.", "Walk back without it."]],
 ["connection", "Call someone instead of sending a message.", "People expected a phone call to an old friend to feel awkward and preferred email. In fact the call created a much stronger bond, and was not more awkward.", "Kumar & Epley, Journal of Experimental Psychology: General, 2021", 60, ["Think of someone you miss.", "Decide when you will call.", "Or call now."]],
 ["nourishment", "Eat your next meal without a screen.", "A review of 24 studies found that eating while distracted makes us eat more, and even more at the next meal.", "Robinson et al., American Journal of Clinical Nutrition, 2013", 60, ["Put the phone face down, away.", "Look at your plate before you start.", "Taste the first three bites."]],
 ["joy", "Eat something ripe, slowly, standing at the kitchen sink.", "On days when people savoured good moments, those moments lifted their happiness more.", "Jose, Lim & Bryant, Journal of Positive Psychology, 2012", 60, ["Choose something ripe: a peach, a pear, a fig.", "Stand at the sink. No plate, no phone.", "Eat it slowly. Notice the first bite."]],
 ["sleep", "Have your last coffee before noon.", "A strong dose of caffeine, about four cups of coffee, taken six hours before bed cut sleep by more than an hour, and people barely noticed.", "Drake et al., Journal of Clinical Sleep Medicine, 2013", 30, ["Check the time of your last coffee today.", "After noon, choose a caffeine-free tea.", "Or a glass of warm water."]],
 ["movement", "Spend ten minutes moving gently after you wake up. Not to perform, only to arrive.", "In a survey of 1.2 million Americans, even gentle movement such as yoga and tai chi went together with fewer days of feeling stressed or low.", "Chekroud et al., The Lancet Psychiatry, 2018", 60, ["Stand beside the bed.", "Roll your shoulders, reach up, bend slowly.", "Move only as far as feels kind."]],
 ["nature", "Open a window and listen for birds.", "In a study of nearly 1,300 people, seeing or hearing birds was linked to better mental wellbeing for up to eight hours, also in people living with depression.", "Hammoud et al., Scientific Reports, 2022", 60, ["Open a window.", "Close your eyes.", "Count the different calls you hear."]],
 ["stillness", "Do nothing for sixty seconds. Notice three breaths, one sound, one thing you see.", "People who first did something boring, reading a phone book, then thought of more uses for two plastic cups than people who had not been bored.", "Mann & Cadman, Creativity Research Journal, 2014", 60, ["Sit down and put your phone away.", "Notice three breaths.", "Then one sound, and one thing you see."]],
 ["connection", "Do one small kind thing before noon.", "A review of 27 studies with over 4,000 people found that acts of kindness raise the wellbeing of the person doing them.", "Curry et al., Journal of Experimental Social Psychology, 2018", 60, ["Think of one person.", "Choose something small: a note, a coffee, a thank you.", "Do it before twelve."]],
 ["joy", "Do one ordinary thing slowly: pour the tea, brush your hair. Notice its rhythm.", "Students who washed dishes mindfully, giving the task their full attention, felt 27% less nervous and 25% more inspired than students who just washed them.", "Hanley et al., Mindfulness, 2015", 60, ["Choose one ordinary task: tea, hair, dishes.", "Do it at half your usual speed.", "Notice its sounds and its rhythm."]],
 ["sleep", "Take your first coffee outside, or by an open window.", "After one week of camping with only natural light, people’s body clocks moved about two hours earlier, and their sleep hormone began to rise around sunset.", "Wright et al., Current Biology, 2013", 60, ["Walk to the window or the door.", "Face the daylight.", "Drink slowly. Nothing else."]],
 ["stillness", "While the kettle boils, just wait. Don’t fill the time.", "A review of 22 studies found that breaks of ten minutes or less left people with more energy and less fatigue.", "Albulescu et al., PLOS ONE, 2022", 60, ["Switch the kettle on.", "Stand still and wait.", "Watch the steam. Nothing else."]],
 ["stillness", "Close your laptop, write tomorrow’s first task, and say “Done for today” out loud.", "Across 86 studies with more than 38,000 employees, people who mentally switched off from work in their free time were less exhausted and slept better.", "Wendsche & Lohmann-Haislah, Frontiers in Psychology, 2017", 60, ["Write tomorrow’s first task on paper.", "Close the laptop.", "Say “Done for today” out loud."]],
 ["stillness", "For the task that keeps nagging you, write one line: when and how you will do it.", "Unfinished tasks kept popping into people’s minds until they wrote a specific plan for them. Making the plan was enough to quiet the intrusive thoughts.", "Masicampo & Baumeister, Journal of Personality and Social Psychology, 2011", 60, ["Name the task that keeps coming back to you.", "Write one line: when and how you will do it.", "Close the notebook. It has a plan now."]],
 ["movement", "Feeling flat? Walk up and down the stairs for ten minutes.", "Tired young women who walked up and down stairs at an easy pace for ten minutes felt more energetic afterwards than after a capsule with a small dose of caffeine.", "Randolph & O’Connor, Physiology & Behavior, 2017", 60, ["Find a staircase.", "Walk up and down at an easy pace.", "After ten minutes, notice your energy."]],
